name: CI

# Every push to any branch (which covers PR branches in this repo, without running twice per push).
on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew :core:test :app:testDebugUnitTest

      # The release build is minified with R8; building it catches shrinking problems early.
      # It's unsigned here (no signing secrets on ordinary pushes).
      - name: Build debug and release APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/build/reports/tests/"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: dotboard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
